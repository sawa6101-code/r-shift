name: Register help shop addresses

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-shop-addresses.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Register known shop coordinates
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rshift_sync.py')
          text = path.read_text(encoding='utf-8')
          old = '''def get_shop_coordinates(shop):
    """店舗名から位置を取得する。既知店舗は住所を優先し、未知店舗は住所検索に失敗した時点で明示的に相談対象とする。"""
'''
          new = '''def get_shop_coordinates(shop):
    """店舗名から位置を取得する。登録済み店舗は固定座標を優先し、未知店舗は住所検索に失敗した時点で明示的に相談対象とする。"""
    known_coordinates = {
        "ことぶき店": (136.979084, 35.252121),
        "高蔵寺店": (137.036622, 35.262669),
    }
    if shop in known_coordinates:
        return known_coordinates[shop]
'''
          if old not in text:
              raise SystemExit('対象箇所が見つかりません。既に登録済みか、コード構造が変更されています。')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rshift_sync.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: register coordinates for help shops'
          git push
