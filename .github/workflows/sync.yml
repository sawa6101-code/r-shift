name: R-Shift sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
        run: |
          test -n "$RSHIFT_USER_ID"
          test -n "$RSHIFT_PASSWORD"
      - name: Inspect employee row links
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import rshift_sync
          html, _, _ = rshift_sync.fetch_staff_page()
          soup = BeautifulSoup(html, 'html.parser')
          table = soup.select_one('table.staffpage-monthly-table')
          rows = table.find_all('tr') if table else []
          for i in (3,4,5):
              row = rows[i]
              cell = row.find_all(['td','th'])[0]
              print('[row]', i, 'links=', [(a.get_text(' ',strip=True)[:30], a.get('href'), a.get('onclick')) for a in cell.find_all('a')])
              print('[row]', i, 'inputs=', [(x.get('name'), x.get('value',''), x.get('type')) for x in cell.find_all('input')])
              print('[row]', i, 'buttons=', [(b.get('name'), b.get('value',''), b.get('onclick')) for b in cell.find_all('button')])
          PY
      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py
      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m 'Update shift calendar'
          git push
