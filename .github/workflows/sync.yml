name: R-Shift sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
        run: |
          test -n "$RSHIFT_USER_ID"
          test -n "$RSHIFT_PASSWORD"
      - name: Inspect day-cell structure
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import re
          import rshift_sync
          html, year, month = rshift_sync.fetch_staff_page()
          soup = BeautifulSoup(html, 'html.parser')
          table = soup.select_one('table.staffpage-monthly-table')
          rows = table.find_all('tr') if table else []
          row = rows[4]
          cell = row.find_all(['td','th'])[1]
          print('[cell] top classes=', cell.get('class', []), 'children=', len(cell.find_all(True)))
          seen = set()
          for node in cell.find_all(True):
              classes = tuple(node.get('class', []))
              text = node.get_text(' ', strip=True)
              times = re.findall(r'(?:[01]?\d|2[0-3])[:：][0-5]\d', text)
              key = (node.name, classes, len(times), text[:20])
              if times and key not in seen:
                  seen.add(key)
                  print('[time-node]', key)
          print('[header date nodes]')
          for i, row in enumerate(rows[:3]):
              for node in row.find_all(['td','th']):
                  text = node.get_text(' ', strip=True)
                  if re.search(r'\d{1,2}[/-]\d{1,2}|\d{1,2}月\d{1,2}日', text):
                      print('[date]', node.name, node.get('class', []), text[:60], 'colspan=', node.get('colspan'))
          PY
      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py
      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m 'Update shift calendar'
          git push
