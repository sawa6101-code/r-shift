name: R-Shift sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
        run: |
          test -n "$RSHIFT_USER_ID"
          test -n "$RSHIFT_PASSWORD"
      - name: Inspect logged-in staff label
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import re
          import rshift_sync
          s, response = rshift_sync.login_session()
          soup = BeautifulSoup(response.text, 'html.parser')
          print('[top] title=', soup.title.get_text(' ', strip=True) if soup.title else '')
          for tag in soup.find_all(['a','span','div','p','td','th','label']):
              text = tag.get_text(' ', strip=True)
              if any(k in text for k in ('ログアウト','ようこそ','さん','従業員トップ')) and len(text) < 120:
                  print('[top] text=', text)
          for form in soup.find_all('form'):
              for inp in form.select('input[name]'):
                  name = inp.get('name','').lower()
                  if any(k in name for k in ('staff','employee','user','login','name')):
                      print('[top] input=', inp.get('name'), inp.get('type'), 'has_value=', bool(inp.get('value')))
          PY
      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py
      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m 'Update shift calendar'
          git push
