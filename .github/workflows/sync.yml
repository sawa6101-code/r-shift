name: R-Shift sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'rshift_sync.py'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_HOME_LAT: ${{ secrets.RSHIFT_HOME_LAT }}
          RSHIFT_HOME_LON: ${{ secrets.RSHIFT_HOME_LON }}
        run: |
          test -n "$RSHIFT_USER_ID"
          test -n "$RSHIFT_PASSWORD"
          test -n "$RSHIFT_HOME_LAT"
          test -n "$RSHIFT_HOME_LON"

      - name: Apply registered shop locations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rshift_sync.py')
          text = path.read_text(encoding='utf-8')
          old = '''def get_shop_coordinates(shop):
              """店舗名から位置を取得する。既知店舗は住所を優先し、未知店舗は住所検索に失敗した時点で明示的に相談対象とする。"""
          '''
          new = '''def get_shop_coordinates(shop):
              """店舗名から位置を取得する。登録済み店舗は固定座標を優先し、未知店舗は住所検索に失敗した時点で明示的に相談対象とする。"""
              known_coordinates = {
                  "ことぶき店": (136.979084, 35.252121),
                  "高蔵寺店": (137.036622, 35.262669),
              }
              if shop in known_coordinates:
                  return known_coordinates[shop]
          '''
          if old not in text:
              raise SystemExit('店舗位置登録箇所を特定できませんでした')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_HOME_LAT: ${{ secrets.RSHIFT_HOME_LAT }}
          RSHIFT_HOME_LON: ${{ secrets.RSHIFT_HOME_LON }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py

      - name: Apply manual shift corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from datetime import datetime, timedelta

          path = Path('docs/shift_calendar.ics')
          text = path.read_text(encoding='utf-8')

          overrides = {
              '20260913': ('1000', '2000'),
              '20260920': ('1000', '1900'),
              '20260921': ('0945', '2100'),
          }

          blocks = re.findall(r'BEGIN:VEVENT\r?\n.*?\r?\nEND:VEVENT', text, re.S)
          if not blocks:
              raise SystemExit('ICSイベントが見つかりませんでした')

          def replace_line(block, prefix, value):
              pattern = rf'(?m)^{re.escape(prefix)}[^\\r\\n]*$'
              new_line = prefix + value
              updated, count = re.subn(pattern, new_line, block, count=1)
              return updated, count

          updated_blocks = []
          for block in blocks:
              m_start = re.search(r'DTSTART;TZID="UTC\+09:00":(\d{8})T(\d{4})', block)
              if not m_start:
                  updated_blocks.append(block)
                  continue

              day = m_start.group(1)
              if day in overrides and 'SUMMARY:' in block and '応援' in block.split('SUMMARY:', 1)[1].splitlines()[0]:
                  start, end = overrides[day]
                  block = re.sub(
                      rf'(?m)^DTSTART;TZID="UTC\+09:00":{day}T\d{{4}}$',
                      f'DTSTART;TZID="UTC+09:00":{day}T{start}',
                      block,
                      count=1,
                  )
                  block = re.sub(
                      rf'(?m)^DTEND;TZID="UTC\+09:00":{day}T\d{{4}}$',
                      f'DTEND;TZID="UTC+09:00":{day}T{end}',
                      block,
                      count=1,
                  )

              if day in overrides and 'SUMMARY:出勤移動' in block:
                  start, _ = overrides[day]
                  travel_m = re.search(r'X-RSHIFT-TRAVEL-MINUTES:(\d+)', block)
                  buffer_m = re.search(r'X-RSHIFT-TRAVEL-BUFFER-MINUTES:(\d+)', block)
                  if not travel_m or not buffer_m:
                      raise SystemExit(f'移動情報を取得できませんでした: {day}')
                  shift_start = datetime.strptime(day + start, '%Y%m%d%H%M')
                  departure = shift_start - timedelta(
                      minutes=int(travel_m.group(1)) + int(buffer_m.group(1))
                  )
                  block = re.sub(
                      rf'(?m)^DTSTART;TZID="UTC\+09:00":{day}T\d{{4}}$',
                      f'DTSTART;TZID="UTC+09:00":{day}T{departure:%H%M}',
                      block,
                      count=1,
                  )
                  block = re.sub(
                      rf'(?m)^DTEND;TZID="UTC\+09:00":{day}T\d{{4}}$',
                      f'DTEND;TZID="UTC+09:00":{day}T{start}',
                      block,
                      count=1,
                  )

              updated_blocks.append(block)

          # 元のVEVENT位置を保ったまま置換
          it = iter(updated_blocks)
          text = re.sub(r'BEGIN:VEVENT\r?\n.*?\r?\nEND:VEVENT', lambda _: next(it), text, flags=re.S)
          path.write_text(text, encoding='utf-8')
          print('手動修正: 2026-09-13 10:00-20:00 / 2026-09-20 10:00-19:00 / 2026-09-21 09:45-21:00')
          PY

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m "Update shift calendar"
          git push
