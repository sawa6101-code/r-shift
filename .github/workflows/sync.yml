name: R-Shift sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - 'rshift_sync.py'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_HOME_LAT: ${{ secrets.RSHIFT_HOME_LAT }}
          RSHIFT_HOME_LON: ${{ secrets.RSHIFT_HOME_LON }}
        run: |
          test -n "$RSHIFT_USER_ID"
          test -n "$RSHIFT_PASSWORD"
          test -n "$RSHIFT_HOME_LAT"
          test -n "$RSHIFT_HOME_LON"

      - name: Apply registered shop locations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('rshift_sync.py')
          text = path.read_text(encoding='utf-8')
          old = '''def get_shop_coordinates(shop):
              """店舗名から位置を取得する。既知店舗は住所を優先し、未知店舗は住所検索に失敗した時点で明示的に相談対象とする。"""
          '''
          new = '''def get_shop_coordinates(shop):
              """店舗名から位置を取得する。登録済み店舗は固定座標を優先し、未知店舗は住所検索に失敗した時点で明示的に相談対象とする。"""
              known_coordinates = {
                  "ことぶき店": (136.979084, 35.252121),
                  "高蔵寺店": (137.036622, 35.262669),
              }
              if shop in known_coordinates:
                  return known_coordinates[shop]
          '''
          if old not in text:
              raise SystemExit('店舗位置登録箇所を特定できませんでした')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_HOME_LAT: ${{ secrets.RSHIFT_HOME_LAT }}
          RSHIFT_HOME_LON: ${{ secrets.RSHIFT_HOME_LON }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py

      - name: Apply manual shift corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from datetime import datetime, timedelta

          path = Path('docs/shift_calendar.ics')
          text = path.read_text(encoding='utf-8')

          overrides = {
              '20260913': ('1000', '2000'),
              '20260920': ('1000', '1900'),
              '20260921': ('0945', '2100'),
          }

          blocks = re.findall(r'BEGIN:VEVENT\r?\n.*?\r?\nEND:VEVENT', text, re.S)
          if not blocks:
              raise SystemExit('ICSイベントが見つかりませんでした')

          updated_blocks = []
          changed_shifts = set()
          changed_travel = set()

          for block in blocks:
              lines = block.splitlines()
              summary = next((line for line in lines if line.startswith('SUMMARY:')), '')
              start_line = next((line for line in lines if line.startswith('DTSTART;TZID="UTC+09:00":')), '')
              m = re.search(r':(\d{8})T(\d{4})$', start_line)
              day = m.group(1) if m else None

              if day in overrides and '応援' in summary:
                  start, end = overrides[day]
                  for i, line in enumerate(lines):
                      if line.startswith(f'DTSTART;TZID="UTC+09:00":{day}T'):
                          lines[i] = f'DTSTART;TZID="UTC+09:00":{day}T{start}'
                          changed_shifts.add(day)
                      elif line.startswith(f'DTEND;TZID="UTC+09:00":{day}T'):
                          lines[i] = f'DTEND;TZID="UTC+09:00":{day}T{end}'

              if day in overrides and summary == 'SUMMARY:出勤移動':
                  start, _ = overrides[day]
                  travel_m = re.search(r'X-RSHIFT-TRAVEL-MINUTES:(\d+)', block)
                  buffer_m = re.search(r'X-RSHIFT-TRAVEL-BUFFER-MINUTES:(\d+)', block)
                  if not travel_m or not buffer_m:
                      raise SystemExit(f'移動情報を取得できませんでした: {day}')
                  shift_start = datetime.strptime(day + start, '%Y%m%d%H%M')
                  departure = shift_start - timedelta(
                      minutes=int(travel_m.group(1)) + int(buffer_m.group(1))
                  )
                  for i, line in enumerate(lines):
                      if line.startswith(f'DTSTART;TZID="UTC+09:00":{day}T'):
                          lines[i] = f'DTSTART;TZID="UTC+09:00":{day}T{departure:%H%M}'
                          changed_travel.add(day)
                      elif line.startswith(f'DTEND;TZID="UTC+09:00":{day}T'):
                          lines[i] = f'DTEND;TZID="UTC+09:00":{day}T{start}'

              updated_blocks.append('\n'.join(lines))

          missing_shifts = set(overrides) - changed_shifts
          missing_travel = set(overrides) - changed_travel
          if missing_shifts:
              raise SystemExit(f'勤務時間を修正できませんでした: {sorted(missing_shifts)}')
          if missing_travel:
              raise SystemExit(f'出勤移動を修正できませんでした: {sorted(missing_travel)}')

          it = iter(updated_blocks)
          text = re.sub(r'BEGIN:VEVENT\r?\n.*?\r?\nEND:VEVENT', lambda _: next(it), text, flags=re.S)
          path.write_text(text, encoding='utf-8')
          print('手動修正: 2026-09-13 10:00-20:00 / 2026-09-20 10:00-19:00 / 2026-09-21 09:45-21:00')
          PY

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m "Update shift calendar"
          git push
