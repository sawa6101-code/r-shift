name: R-Shift sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
        run: |
          test -n "$RSHIFT_USER_ID" || { echo 'RSHIFT_USER_ID が未設定です'; exit 1; }
          test -n "$RSHIFT_PASSWORD" || { echo 'RSHIFT_PASSWORD が未設定です'; exit 1; }
          echo 'R-Shift認証情報: 設定済み'

      - name: Inspect R-Shift DOM structure
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import rshift_sync

          html = rshift_sync.login_and_fetch()
          soup = BeautifulSoup(html, 'html.parser')
          selectors = ['.staffpage-plan-list-shift', '.plan_list_shift', '.popup_working_time', '.shift_non_confirm']
          for selector in selectors:
              nodes = soup.select(selector)
              print(f'[dom] {selector}: {len(nodes)}')
              for i, node in enumerate(nodes[:12]):
                  parent = node.parent
                  chain = []
                  cur = node
                  for _ in range(5):
                      if cur is None: break
                      chain.append(f'{cur.name}.{".".join(cur.get("class", []))}')
                      cur = cur.parent
                  sibling_classes = []
                  if parent:
                      for sib in parent.find_all(recursive=False):
                          if sib is node: continue
                          sibling_classes.append(f'{sib.name}.{".".join(sib.get("class", []))}')
                  times = re.findall(r'(?:[01]?\d|2[0-3])[:：][0-5]\d', node.get_text(' ', strip=True))
                  print(f'[dom]   {i}: chain={chain} siblings={sibling_classes[:12]} time_count={len(times)}')
          date_like = []
          for tag in soup.find_all(True):
              if tag.find(True): continue
              text = tag.get_text(' ', strip=True)
              if re.search(r'\d{1,2}[/-]\d{1,2}|\d{1,2}月\d{1,2}日', text):
                  date_like.append((tag.name, tag.get('class', []), text[:40]))
          print(f'[dom] leaf date-like count: {len(date_like)}')
          for item in date_like[:30]:
              print('[dom] date-like:', item[0], item[1], item[2])
          PY

      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py

      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m 'Update shift calendar'
          git push
