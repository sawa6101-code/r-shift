name: R-Shift sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
        run: |
          test -n "$RSHIFT_USER_ID" || { echo 'RSHIFT_USER_ID が未設定です'; exit 1; }
          test -n "$RSHIFT_PASSWORD" || { echo 'RSHIFT_PASSWORD が未設定です'; exit 1; }
          echo 'R-Shift認証情報: 設定済み'

      - name: Inspect target-month response
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import re
          import rshift_sync
          html = rshift_sync.fetch_staff_page()
          soup = BeautifulSoup(html, 'html.parser')
          print('[inspect] title=', soup.title.get_text(' ', strip=True) if soup.title else '')
          print('[inspect] forms=', len(soup.find_all('form')))
          for i, form in enumerate(soup.find_all('form')):
              names = [x.get('name','') for x in form.select('input[name]')]
              print('[inspect] form', i, 'action=', form.get('action'), 'method=', form.get('method'), 'inputs=', len(names), 'select_date=', sum(n.startswith('select_date') for n in names), 'time_fields=', sum(n.startswith(('from_hour','to_hour','from_minutes','to_minutes')) for n in names))
          print('[inspect] plan classes=', len(soup.select('[class*="plan_list_shift"]')), 'working-time=', len(soup.select('[class*="working_time"]')))
          PY

      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py

      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m 'Update shift calendar'
          git push
