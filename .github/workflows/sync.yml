name: R-Shift sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate secrets
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
        run: |
          test -n "$RSHIFT_USER_ID" || { echo 'RSHIFT_USER_ID が未設定です'; exit 1; }
          test -n "$RSHIFT_PASSWORD" || { echo 'RSHIFT_PASSWORD が未設定です'; exit 1; }
          echo 'R-Shift認証情報: 設定済み'

      - name: Inspect monthly table
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: |
          python - <<'PY'
          from bs4 import BeautifulSoup
          import re
          import rshift_sync
          html, year, month = rshift_sync.fetch_staff_page()
          soup = BeautifulSoup(html, 'html.parser')
          print('[inspect] tables=', len(soup.find_all('table')))
          for ti, table in enumerate(soup.find_all('table')[:5]):
              print('[inspect] table', ti, 'class=', table.get('class', []), 'rows=', len(table.find_all('tr')))
              for ri, row in enumerate(table.find_all('tr')[:20]):
                  text = row.get_text(' | ', strip=True)
                  times = re.findall(r'(?:[01]?\d|2[0-3])[:：][0-5]\d', text)
                  dates = re.findall(r'\d{1,2}[/-]\d{1,2}|\d{1,2}月\d{1,2}日', text)
                  print('[inspect] row', ri, 'cells=', len(row.find_all(['td','th'])), 'dates=', dates[:5], 'times=', times[:6], 'text=', text[:300])
          PY

      - name: Fetch shifts and generate ICS
        env:
          RSHIFT_USER_ID: ${{ secrets.RSHIFT_USER_ID }}
          RSHIFT_PASSWORD: ${{ secrets.RSHIFT_PASSWORD }}
          RSHIFT_BASE_URL: https://sgy5zm.rshift.jp
          RSHIFT_ID_FIELD: login_id
          RSHIFT_PASSWORD_FIELD: password
        run: python rshift_sync.py

      - name: Commit updated calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shift_calendar.ics
          git diff --cached --quiet || git commit -m 'Update shift calendar'
          git push
